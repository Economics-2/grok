            card.className = 'card';
            card.innerHTML = `
                <img src="\( {item.image_url}" alt=" \){item.keywords}" loading="lazy">
                <div class="card-content">
                    <div class="prompt">${item.prompt}</div>
                    <div class="buttons">
                        <button class="copy-btn" onclick="copyPrompt('${item.prompt.replace(/'/g, "\\'")}')">Copy Prompt</button>
                        <a href="https://grok.x.ai/?q=${encodeURIComponent('Generate a short video idea based on this prompt: ' + item.prompt)}" target="_blank">
                            <button class="generate-btn">Generate with Grok</button>
                        </a>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        function copyPrompt(prompt) {
            navigator.clipboard.writeText(prompt).then(() => {
                alert('Prompt copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
